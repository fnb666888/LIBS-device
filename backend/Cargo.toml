[package]
name = "libs-backend"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "libs_backend"

[[bin]]
name = "businessd"
path = "src/main.rs"

[[example]]
name = "algorithm_test_worker"
path = "tests/fixtures/algorithm_worker.rs"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
parking_lot = "0.12"
serialport = { version = "4", default-features = false }
libloading = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_SystemInformation"] }
csv = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
